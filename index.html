<style>

<script>
'use strict';
/* =====================================================================
   METRO MANILA LIFE: STUDENT SIM  (modular architecture)

   1.  Utilities
   2.  DATA              all content and tuning numbers (jobs, items, events, kits...)
   3.  Infrastructure    StateMachine, EventBus, Storage, GameState, EffectEngine
   4.  Managers          World, Time, PlayerStats, Economy, Academics, Career,
                         Social, Shop, Hobby (Gunpla), Events
   5.  ActionRegistry    builds the "Do" menu from DATA.actions
   6.  UIController      UI state machine (PLAY / MODAL / MINIGAME / GAMEOVER)
   7.  GameEngine        wires everything together; the only place commands enter
   8.  Renderer          the ONLY code that touches the DOM
   ===================================================================== */

/* ---------------------------------------------------------------- 1. UTILITIES */
const Util = {
  rnd: (a, b) => a + Math.random() * (b - a),
  clamp: (v, a = 0, b = 100) => Math.max(a, Math.min(b, v)),
  fmt: n => '₱' + Math.round(n).toLocaleString('en-US'),
  avg: a => a.length ? a.reduce((x, y) => x + y, 0) / a.length : 0,
  pick: a => a[Math.floor(Math.random() * a.length)],
  shuffle: a => [...a].sort(() => Math.random() - .5),
  clock: h => `${h % 12 || 12}:00 ${h < 12 ? 'AM' : 'PM'}`,
  clean: s => String(s).replace(/[<>&"]/g, ''),
  val: (x, ...a) => typeof x === 'function' ? x(...a) : x
};
const { rnd, clamp, fmt, avg, pick, shuffle, clock, val } = Util;

   Effect objects ("fx") are interpreted by EffectEngine. Supported keys:
   spend, bill, cash, debt, need, needSet, skill, rel, relSet, prep, hw, xp,

*/

/* ---------------------------------------------------------------- 3. INFRASTRUCTURE */
class StateMachine {
  constructor(name, initial, table) { this.name = name; this.state = initial; this.table = table; }
  can(to) { const a = this.table[this.state] || []; return a.includes(to) || a.includes('*'); }
  go(to) {
    if (this.state === to) return true;
    if (!this.can(to)) { console.warn(`[${this.name}] blocked transition ${this.state} -> ${to}`); return false; }
    this.state = to; return true;
  }
  is(...s) { return s.includes(this.state); }
  force(to) { this.state = to; }
}

class EventBus {
  constructor() { this.h = {}; }
  on(e, f) { (this.h[e] = this.h[e] || []).push(f); }
  emit(e, p) { (this.h[e] || []).forEach(f => f(p)); }
}

class Storage {
  constructor(key) { this.key = key; }
  load() { try { return JSON.parse(localStorage.getItem(this.key)); } catch { return null; } }
  save(s) { try { localStorage.setItem(this.key, JSON.stringify(s)); return true; } catch { return false; } }
  clear() { try { localStorage.removeItem(this.key); } catch { /* ignore */ } }
}

      ppl: [], club: null, fund: 0, wx: 'sun', tyLast: -99, badRun: 0, rm: { t: 'family', items: [], wall: null }, look: f.look || { ...DATA.chr.def, acc: [] }, inv: f.job === 'rider' ? ['bike'] : [], buddy: 0, fails: 0, hist: [], log: [], sick: 0,

  }
  /* Fills in anything an older save is missing so it never throws */
  static migrate(S) {
    S.loc = S.loc || 'home'; S.inv = S.inv || []; S.R.prof = S.R.prof ?? 20; S.buddy = S.buddy || 0;
    if (!DATA.cities[S.city]) S.city = 'Caloocan';

    S.ppl = S.ppl || []; S.club = S.club || null; S.fund = S.fund || 0; S.wx = S.wx || 'sun'; S.tyLast = S.tyLast ?? -99; S.rm = S.rm || { t: 'family', items: [], wall: null }; S.look = S.look || { ...DATA.chr.def, acc: [] }; S.badRun = S.badRun || 0;
    for (const k of ['cook', 'code', 'mus', 'gun', 'des']) S.K[k] = S.K[k] ?? 5;
    S.stash = S.stash || ['zk']; S.shelf = S.shelf || []; S.kit = S.kit || null; S.mj = S.mj || {};
    S.wkSh = S.wkSh || 0; S.per = S.per || []; S.cls = S.cls || []; S.hwl = S.hwl || []; S.called = S.called || 0; S.clsSem = S.clsSem || 0; S.brk = S.brk || []; S.qd = S.qd || 0; S.rep = S.rep || 0; S.built = S.built || 0; S.wins = S.wins || 0;
    S.hist = S.hist || []; S.log = S.log || []; S.sc = S.sc || []; S.fails = S.fails || 0;
    S.cond = S.cond || {}; S.pf = S.pf || { k: 'fair', n: 'Ma’am Reyes' }; S.dn = S.dn || { k: 'fair', n: 'Dean Mercado' }; S.pj = S.pj || []; S.ph = S.ph || []; S.me = S.me || null; S.chats = S.chats || {}; S.pdone = S.pdone || []; S.warns = S.warns || 0; S.thesis = S.thesis || null; S.mk = S.mk || { ev: null, phase: null, left: 0, fake: false, hist: [] };
    return S;
  }
}

/* Interprets declarative "fx" objects from DATA */
class EffectEngine {
  constructor(g) { this.g = g; }
  apply(fx) {
    if (!fx) return;
    const g = this.g, s = g.state;
    if (fx.spend) g.economy.spend(fx.spend);
    if (fx.bill) g.economy.bill(fx.bill);
    if (fx.cash) s.m += fx.cash;
    if (fx.debt) s.debt += fx.debt;
    if (fx.invest) { const n = Math.min(fx.invest, s.m); if (n > 0) { s.m -= n; s.fund += n; g.log(`💹 Invested ${fmt(n)} in the index fund.`); } }
    if (fx.cashout) { const n = fx.cashout === 'all' ? s.fund : Math.min(fx.cashout, s.fund); if (n > 0) { s.fund -= n; s.m += n; g.log(`💵 Cashed out ${fmt(n)} from the index fund.`); } }
    if (fx.need) for (const k in fx.need) s.N[k] += fx.need[k];
    if (fx.needSet) for (const k in fx.needSet) s.N[k] = fx.needSet[k];
    if (fx.skill) for (const k in fx.skill) s.K[k] += fx.skill[k];
    if (fx.rel) for (const k in fx.rel) s.R[k] += fx.rel[k];
    if (fx.relSet) for (const k in fx.relSet) s.R[k] = fx.relSet[k];
    if (fx.prep) s.prep += fx.prep;
    if (fx.hw) s.hw += fx.hw;
    if (fx.xp) s.xp += fx.xp;
    if (fx.sick !== undefined) s.sick = fx.sick;
    if (fx.buddy) s.buddy = 1;
    if (fx.person) s.ppl.push({ ...fx.person });
    if (fx.chance) fx.chance.forEach(c => { if (Math.random() < c.p) this.apply(c.fx); });
    if (fx.menu === 'jobs') g.career.openJobMenu();
    if (fx.log) g.log(fx.log);
  }
}

/* ---------------------------------------------------------------- 4. MANAGERS */
class Manager { constructor(g) { this.g = g; } get s() { return this.g.state; } }

class WorldManager extends Manager {
  get city() { return DATA.cities[this.s.city]; }
  at() { return this.s.at || this.s.city; }
  atHome() { return this.at() === this.s.city; }
  avail(k) { return this.atHome() || k === 'mall' || k === 'court'; }
  col() { return this.atHome() ? (this.s.col || 1) : DATA.cities[this.at()].c; }
  locations(home) {
    const out = {}, c = home ? this.city : DATA.cities[this.at()];
    for (const k in DATA.locations) out[k] = [DATA.locations[k].icon, DATA.locations[k].name(this.s, c)];
    return out;
  }
  rollWeather() {
    const s = this.s, W = DATA.weather, d = this.g.time.dayIndex, r = Math.random();
    let wx = W.table.find(([, p]) => r < p)[0];
    if (wx === 'ty' && (d < W.tyGrace || d - (s.tyLast ?? -99) < W.tyCooldown)) wx = 'rain';
    if ((wx === 'rain' || wx === 'ty') && (s.badRun || 0) >= W.maxBadRun) wx = 'cloud';
    s.badRun = wx === 'rain' || wx === 'ty' ? (s.badRun || 0) + 1 : 0;
    if (wx === 'ty') s.tyLast = d;
    s.wx = wx;
    if (s.wx === 'ty') this.g.log('🌀 Typhoon! Classes and work are suspended.');
  }
  travelCost() {
    return this.g.has('bike') ? 0 : 13 * (DATA.weather.travelMult[this.s.wx] || 1);
  }
}

class TimeManager extends Manager {
  get hour() { return this.s.t % 24; }
  get dayIndex() { return Math.floor(this.s.t / 24); }
  get weekday() { return this.dayIndex % 7; }
  get week() { return Math.floor(this.s.t / 168) + 1; }
  get semester() { return Math.floor((this.week - 1) / DATA.weeksPerSemester) + 1; }
  get date() { const [y, m, d] = DATA.startDate; return new Date(y, m, d + this.dayIndex); }
  sleepHours() { const h = this.hour; return h < 6 ? 6 - h : h >= 20 ? 30 - h : 3; }
  tick(sleeping = false) {
    this.s.t++;
    this.g.bus.emit('hour', { sleeping, h: this.hour, w: this.weekday });
    if (this.hour === 0) this.newDay();
  }
  advance(mins) { const s = this.s; s.tm = (s.tm || 0) + Math.round(mins); while (s.tm >= 60) { s.tm -= 60; this.tick(); } }
  newDay() {
    const d = this.dayIndex, ctx = { d, w: d % 7, wk: Math.floor(d / 7) + 1 };
    this.g.world.rollWeather();
    this.g.bus.emit('day:begin', ctx);
    this.g.bus.emit('day:close', ctx);
  }
}

class PlayerStats extends Manager {
  constructor(g) {
    super(g);
    g.bus.on('hour', e => this.decay(e.sleeping));
    g.bus.on('day:begin', () => this.rollSickness());
  }
  trait(key, def) {
    for (const t of this.s.tr) { const m = DATA.traits[t] && DATA.traits[t].mods; if (m && m[key] !== undefined) return m[key]; }
    return def;
  }
  efficiency() { const N = this.s.N; return Math.max(.3, .35 + .85 * (N.e * 2 + N.h + N.f + N.y * .5) / 450) * (this.s.sick ? .6 : 1); }
  studyMult() { return this.trait('studyMult', 1) * (this.g.has('laptop') ? 1.15 : 1) * (this.s.buddy ? 1.1 : 1); }
  decay(sleeping) {
    const N = this.s.N, g = this.g;
    if (sleeping) { N.e += g.has('fan') ? 13 : 11; N.h -= 1.5; N.y -= .7; N.f -= .7; N.s -= .5; }
    else {
      const D = DATA.decay;
      N.e -= this.trait('energyDrain', D.e); N.h -= this.trait('hungerDrain', D.h); N.y -= D.y; N.f -= D.f; N.s -= this.trait('socialDrain', D.s);
      if (g.has('pet')) N.f += .6;
      if (N.s < 25) N.f -= 1;
      if (N.h < 10) N.e -= 2;
    }
    for (const k in N) N[k] = clamp(N[k]);
  }
  rollSickness() {
    const s = this.s;
    if (s.sick && --s.sick === 0) this.g.log('💪 You recovered.');
    if (!s.sick && (s.N.y < 20 || s.N.e < 15 || s.N.h < 10) && Math.random() < .2) { s.sick = 3; this.g.log('🤒 You got sick! Efficiency drops.'); }
  }
  applyNeedDeltas(d) {
    const N = this.s.N;
    for (const k in d) {
      let v = d[k];
      if (k === 's' && v > 0) v *= this.trait('socialGain', 1);
      N[k] = clamp(N[k] + v);
    }
  }
  normalize() {
    const s = this.s;
    for (const k in s.N) s.N[k] = clamp(s.N[k]);
    for (const k in s.R) s.R[k] = clamp(s.R[k]);
    s.prep = clamp(s.prep); s.hw = Math.max(0, s.hw); s.m = Math.max(0, s.m);
  }
}

class EconomyManager extends Manager {
  constructor(g) { super(g); g.bus.on('day:close', c => { if (c.w === 6) this.weekly(c.wk); }); }
  dc(c) { return c ? Math.round(c * this.g.world.col() * this.g.stats.trait('spendMult', 1) * this.g.market.priceMult()) : c; }
  weeklyBill() { return Math.round(DATA.economy.weeklyBill * (this.s.col || 1) * this.g.market.priceMult()); }
  spend(n) { this.s.m -= Math.min(this.s.m, n); }
  bill(n) { const s = this.s; if (s.m >= n) s.m -= n; else { s.debt += n - s.m; s.m = 0; } }
  weekly(wk) {
    const s = this.s, E = DATA.economy, st = this.g.stats;
    const al = Math.round((E.baseAllowance + (s.tu > E.tuitionBonusAt ? E.tuitionBonus : 0) + s.R.nanay * E.nanayAllowance) * st.trait('allowMult', 1));
    const bill = this.weeklyBill() + this.g.rooms.rent(), tu = wk % E.tuitionEveryWeeks === 0 ? s.tu : 0;
    const it = Math.round(s.debt * E.debtInterest), iv = Math.round(s.sav * st.trait('saveRate', .005));
    s.m += al; s.debt += it; s.sav += iv;
    const r = this.g.market.weekly(), hadFund = s.fund > 0;
    s.fund = Math.round(s.fund * (1 + r));
    if (hadFund) this.g.log(`${r >= 0 ? '📈' : '📉'} Index fund ${r >= 0 ? '+' : ''}${(r * 100).toFixed(1)}% this week (now ${fmt(s.fund)}).`);
    if (this.g.has('pet')) this.spend(100);
    this.bill(bill + tu);
    this.g.log(`🧾 Sunday: +${fmt(al)} allowance, -${fmt(bill)} bills${tu ? ', -' + fmt(tu) + ' tuition' : ''}${it ? ', +' + fmt(it) + ' debt interest' : ''}.`);
  }
  bank(op) {
    const s = this.s;
    const ops = {
      dep: () => { const n = Math.min(200, s.m); s.m -= n; s.sav += n; },
      wd: () => { const n = Math.min(200, s.sav); s.sav -= n; s.m += n; },
      bor: () => {
        if (s.debt > DATA.economy.maxLoan) return this.g.ui.toast('No one will lend to you anymore!');
        s.m += 500; s.debt += 500; s.R.bar -= 3; this.g.log('🤝 Borrowed ₱500 (5% interest per week).');
      },
      rep: () => { const n = Math.min(500, s.m, s.debt); s.m -= n; s.debt -= n; },
      iv: () => { const n = Math.min(500, s.m); s.m -= n; s.fund += n; },
      ou: () => { const n = Math.min(500, s.fund); s.fund -= n; s.m += n; },
      iv2: () => { const n = Math.min(1000, s.m); s.m -= n; s.fund += n; },
      ouall: () => { s.m += s.fund; s.fund = 0; }
    };
    if (ops[op]) ops[op]();
  }
  playLotto() {
    const r = Math.random();
    let acc = 0;
    for (const t of DATA.lotto.tiers) {
      acc += t.p;
      if (r < acc) { this.s.m += t.cash; return this.g.log(t.log); }
    }
    this.g.log(DATA.lotto.miss);
  }
}

/* Index fund weather: rumors give a one-week warning, then the event drives returns */
class MarketManager extends Manager {
  get m() { return this.s.mk; }
  get event() { return this.m.ev ? DATA.market.events[this.m.ev] : null; }
  activeEvent() { return this.m.phase === 'active' ? this.event : null; }
  priceMult() { const e = this.activeEvent(); return e && e.priceMult ? e.priceMult : 1; }
  status() {
    const m = this.m, e = this.event;
    if (!e) return { phase: 'steady', text: '😐 Markets are steady.' };
    if (m.phase === 'rumor') return { phase: 'rumor', text: `⚠️ Rumor: ${e.icon} ${e.name} may hit next week.` };
    return { phase: 'active', text: `${e.icon} ${e.name}: ${m.left} week${m.left > 1 ? 's' : ''} left${e.priceMult ? ` (prices +${Math.round((e.priceMult - 1) * 100)}%)` : ''}` };
  }
  clear() { const m = this.m; m.ev = null; m.phase = null; m.left = 0; m.fake = false; }
  /* Called every Sunday by EconomyManager. Returns this week's fractional return. */
  weekly() {
    const m = this.m, M = DATA.market;
    if (m.ev && m.phase === 'rumor') {
      const e = this.event;
      if (m.fake) { this.g.log('📰 False alarm: the markets stayed calm.'); this.clear(); }
      else { m.phase = 'active'; m.left = Math.floor(rnd(e.weeks[0], e.weeks[1] + 1)); this.g.log(e.start); }
    }
    const e = this.activeEvent(), drift = e ? e.drift : M.base.drift, vol = e ? e.vol : M.base.vol;
    const r = clamp(drift + rnd(-vol, vol), -.35, .4);
    m.hist.push(Math.round(r * 1000) / 1000); if (m.hist.length > 8) m.hist.shift();
    if (e) { if (--m.left <= 0) { this.g.log(`${e.icon} ${e.name} cooled off.`); this.clear(); } }
    else if (!m.ev && Math.random() < M.chance) this.announce();
    return r;
  }
  announce() {
    const m = this.m, M = DATA.market, id = pick(Object.keys(M.events)), e = M.events[id];
    m.ev = id; m.phase = 'rumor'; m.left = 0; m.fake = Math.random() < M.fakeChance;
    this.g.log(`📰 Market rumor: ${e.icon} ${e.name}.`);
    this.g.events.present({ text: e.rumor, options: M.alerts[e.kind] });
  }
}

/* Gear wears out with use and over time; broken gear stops working until repaired */
class MaintenanceManager extends Manager {
  constructor(g) { super(g); g.bus.on('day:close', c => { if (c.w === 6) this.weeklyDecay(); }); }
  owns(k) { return this.s.inv.includes(k); }
  tracked(k) { return !!DATA.items[k].maint; }
  cond(k) { const v = this.s.cond[k]; return v === undefined ? 100 : v; }
  working(k) { return this.owns(k) && (!this.tracked(k) || this.cond(k) > 0); }
  needsAttention() { return this.s.inv.some(k => this.tracked(k) && this.cond(k) < DATA.maintenance.warnAt); }
  wear(k, n) {
    if (!n || !this.working(k) || !this.tracked(k)) return;
    const s = this.s, M = DATA.items[k].maint, mt = DATA.maintenance, was = this.cond(k);
    let c = Math.max(0, was - n), sudden = false;
    if (c > 0 && c < 25 && Math.random() < mt.suddenFailure) { c = 0; sudden = true; }
    s.cond[k] = c;
    if (c === 0) {
      this.g.log(`💥 ${sudden ? M.fail + ' ' : ''}${M.broken}`);
      this.breakAlert(k, (sudden ? M.fail + ' ' : '') + M.broken);
    } else if (c < mt.warnAt && was >= mt.warnAt) this.g.log(`⚠️ ${M.warn}`);
  }
  wearMany(o) { if (o) for (const k in o) this.wear(k, o[k]); }
  onAction(key) {
    const id = key.split('@')[0];
    for (const k in DATA.items) { const m = DATA.items[k].maint, u = m && m.uses && m.uses[id]; if (u) this.wear(k, u); }
  }
  weeklyDecay() { for (const k of this.s.inv) if (this.tracked(k)) this.wear(k, DATA.items[k].maint.weekly); }
  fullCost(k) { const mt = DATA.maintenance, M = DATA.items[k].maint; return Math.round(this.g.economy.dc(M.fix * (mt.minFullPct + (1 - mt.minFullPct) * (1 - this.cond(k) / 100)))); }
  quickCost(k) { return Math.round(this.g.economy.dc(DATA.items[k].maint.fix * DATA.maintenance.quickCostPct)); }
  breakAlert(k, msg) {
    const g = this.g, s = this.s, mt = DATA.maintenance, cost = Math.round(g.economy.dc(DATA.items[k].maint.fix * mt.emergencyMult));
    g.ui.showModal({ text: '🔧 ' + msg, options: [
      { label: `Emergency fix (${fmt(cost)}, back to ${mt.emergencyRestore}%)`, run: () => {
        if (s.m < cost) return g.ui.toast('Not enough money!');
        s.m -= cost; s.cond[k] = mt.emergencyRestore; g.log('🛠️ Emergency fix: ' + DATA.items[k].name);
      } },
      { label: 'Deal with it later (repair shop at the mall)' }
    ] });
  }
  openRepair() {
    const g = this.g, s = this.s, mt = DATA.maintenance, options = [];
    for (const k of s.inv) {
      if (!this.tracked(k)) continue;
      const it = DATA.items[k], c = this.cond(k);
      if (c >= 100) continue;
      const full = this.fullCost(k), quick = this.quickCost(k);
      options.push({ label: `${it.name} (${Math.round(c)}%): full repair ${fmt(full)}`, run: () => {
        if (s.m < full) return g.ui.toast('Not enough money!');
        s.m -= full; s.cond[k] = 100; g.log('🛠️ Repaired ' + it.name); this.openRepair();
      } });
      if (c <= 100 - mt.quickService) options.push({ label: `${it.name}: quick service (+${mt.quickService}%) ${fmt(quick)}`, run: () => {
        if (s.m < quick) return g.ui.toast('Not enough money!');
        s.m -= quick; s.cond[k] = Math.min(100, this.cond(k) + mt.quickService); g.log('🛠️ Serviced ' + it.name); this.openRepair();
      } });
    }
    const any = options.length > 0;
    options.push({ label: 'Leave' });
    g.ui.showModal({ text: any ? 'Repair shop. What needs fixing?' : 'Everything you own is in good shape.', options });
  }
}

class AcademicsManager extends Manager {
  constructor(g) {
    super(g);
    g.bus.on('hour', e => this.checkMissedClass(e));
    g.bus.on('day:begin', () => { const s = this.s; s.att = 0; s.per = []; s.brk = []; s.qd = 0; s.called = 0; });
    g.bus.on('day:close', c => { if (c.w === 0 && c.wk > 1 && (c.wk - 1) % DATA.weeksPerSemester === 0) this.endSemester(); });
  }
  get P() { return DATA.profs[this.s.pf.k]; }
  get D() { return DATA.deans[this.s.dn.k]; }
  late() { return this.P.late; }
  average() { return avg(this.s.sc) - Math.max(0, this.s.abs - this.P.grace) * this.P.absPen; }
  gpa(p) { const b = DATA.academics.gradeBands.find(([min]) => p >= min); return b ? b[1] : 5; }
  score(mod = 0) {
    const s = this.s;
    /* freshmanSupport: a small score cushion in semesters 1 and 2 (orientation, study groups) that fades to zero. */
    const fresh = DATA.academics.freshmanSupport[this.g.time.semester - 1] || 0;
    return clamp(DATA.academics.baseScore + fresh + s.prep * .4 + s.K.int * .25 + rnd(-7, 7) + s.R.prof / 20 - 4 * s.hw * this.P.hw + this.P.quiz + mod);
  }
  checkMissedClass(e) {
    const s = this.s, g = this.g;
    if (e.h !== this.late() + DATA.school.span || e.w > 4 || s.wx === 'ty') return; /* the last bell */
    if (!s.att) {
      s.abs++; g.log('❌ You missed class.');
      if (e.w === DATA.academics.quizDay) s.sc.push(45);
      else if (Math.random() < this.P.pop * .6) { s.sc.push(40); g.log('📝 You missed a pop quiz: 40%.'); }
    } else {
      const n = DATA.school.classOffsets.length;
      if (e.w === DATA.academics.quizDay && !s.qd) { s.sc.push(45); g.log('📝 You skipped the last period and missed the quiz: 45%.'); }
      if (s.att < n) g.log(`🚪 You cut ${n - s.att} of ${n} periods today.`);
    }
    if (Math.random() < this.D.sweep) this.sweep(!!s.att);
  }
  sweep(here) {
    const s = this.s, g = this.g, D = this.D, n = s.dn.n;
    if (here) { s.R.prof += 1; return g.log(`🕵️ ${n} swept the room. You were present.`); }
    const chance = clamp(s.K.cha / 80, .15, .7);
    g.ui.showModal({ text: `🕵️ ${n} did a surprise attendance sweep and found your empty seat!`, options: [
      { label: `Pay the ${fmt(D.fine)} fine`, run: () => g.economy.spend(D.fine) },
      { label: 'Write an apology letter (Charisma check)', run: () => { if (Math.random() < chance) g.log('✉️ The dean accepted your apology.'); else { g.economy.spend(D.fine); s.abs++; g.log('✉️ Letter rejected: fine plus another absence.'); } } },
      { label: 'Ignore it', run: () => { s.R.prof -= 4; s.abs++; g.log('😬 You ignored the dean. Another absence.'); } }] });
  }
  /* What is the bell doing at this hour? null = outside school hours. */
  slot(h = this.g.time.hour) {
    const s = this.s, A = DATA.school, o = h - this.late();
    if (o < 0 || o >= A.span) return null;
    const i = A.classOffsets.indexOf(o);
    if (i < 0) return { type: 'break', label: A.breaks[o] };

class CareerManager extends Manager {

    const s = this.s, Q = DATA.shift.weeklyQuota, done = s.wkSh || 0;

    s.rj -= DATA.shift.missedPenalty * (Q - done);
    this.g.log(`😠 You worked ${done} of ${Q} expected shifts this week. Your boss is unhappy.`);
    if (s.rj <= 0) { s.job = null; this.g.log('You were fired.'); }
  }

/* Gunpla: kit lifecycle, mini-game state machine, meets and judging */
class HobbySystem extends Manager {
  constructor(g) {
    super(g);
    /* IDLE -> TIMING | ASSEMBLY | PAINT -> IDLE. Anything else is rejected, so a stage can only be scored once. */
    this.fsm = new StateMachine('hobby', 'IDLE', { IDLE: ['TIMING', 'ASSEMBLY', 'PAINT'], TIMING: ['IDLE'], ASSEMBLY: ['IDLE'], PAINT: ['IDLE'] });
    this.session = null;
    g.bus.on('day:begin', c => this.announceMeets(c));
  }
  get idle() { return this.fsm.is('IDLE'); }
  get kitData() { return DATA.gunpla.kits; }
  abort() { this.session = null; this.fsm.force('IDLE'); }
  /* ---- meets ---- */
  meetDay(l, d) { const m = DATA.gunpla.meets[l]; return d % 7 === m.w && Math.floor(d / 7) % m.k === m.o; }
  meetNow(l, d, h) { const m = DATA.gunpla.meets[l]; return this.meetDay(l, d) && this.s.wx !== 'ty' && h >= m.h[0] && h < m.h[1]; }
  announceMeets(c) {
    const locs = this.g.world.locations(true);
    for (const l in DATA.gunpla.meets) {
      const m = DATA.gunpla.meets[l];
      if (this.meetDay(l, c.d) && this.s.wx !== 'ty') this.g.log(`🤖 Today: ${m.n} at ${locs[l][1]}, ${clock(m.h[0])} to ${clock(m.h[1])}.`);
      else if (this.meetDay(l, c.d + 2)) this.g.log(`🤖 In 2 days: ${m.n} at ${locs[l][1]}. Finish a kit to enter!`);
    }
  }
  /* ---- shop and bench ---- */
  openShop() {
    const g = this.g, s = this.s;
    const options = Object.entries(DATA.gunpla.kits).map(([k, v]) => ({
      label: `${v.name}, ${fmt(g.economy.dc(v.price))} (difficulty ${v.diff})`,
      run: () => { const c = g.economy.dc(v.price); if (s.m < c) return g.ui.toast('Not enough money!'); s.m -= c; s.stash.push(k); g.log('📦 Bought ' + v.name); }
    })).concat(Object.entries(DATA.items).filter(([k, v]) => v.store === 'hobby' && !g.maint.owns(k))
      .map(([k, v]) => ({ label: `${v.name}, ${fmt(v.price)}: ${v.desc}`, run: () => g.shop.buy(k, '🛠️') })));
    options.push({ label: 'Leave' });
    g.ui.showModal({ text: 'Hobby shop: kits and tools. Higher grades are harder but score better.', options });
  }
  openKitMenu() {
    const s = this.s, g = this.g, K = DATA.gunpla.kits;
    const options = s.stash.map((k, i) => ({
      label: `${K[k].name} (difficulty ${K[k].diff})`,
      run: () => { if (s.kit) return; s.stash.splice(i, 1); s.kit = { k, st: 0, q: 0, sty: 'Straight build' }; g.log('🤖 Started building ' + K[k].name); }
    }));
    options.push({ label: 'Never mind' });
    g.ui.showModal({ text: 'Which kit goes on the bench?', options });
  }
  openSellMenu() {
    const s = this.s, g = this.g, K = DATA.gunpla.kits;
    const options = s.shelf.map((k, i) => {
      const v = Math.round(K[k.k].price * (.35 + k.q / 150));
      return { label: `${k.n} (quality ${k.q}): ${fmt(v)}`, run: () => { if (!s.shelf[i]) return; s.shelf.splice(i, 1); s.m += v; g.log(`💰 Sold ${k.n} for ${fmt(v)}`); } };
    });
    options.push({ label: 'Never mind' });
    g.ui.showModal({ text: 'Sell a finished model to a collector?', options });
  }
  skipStep() {
    const s = this.s;
    if (!s.kit || !this.idle) return;
    s.kit.st++; this.g.log('⏭️ You skipped a step.');
    if (s.kit.st >= DATA.gunpla.stages.length) this.finishKit();
  }
  currentStage() { const k = this.s.kit; return k ? DATA.gunpla.stages[k.st] : null; }
  /* ---- stage start: dispatches on stage type ---- */
  startStage() {
    const s = this.s, g = this.g, kit = s.kit, st = this.currentStage();
    if (!kit || !st || !this.idle || !g.ui.fsm.is('PLAY')) return;
    const kd = DATA.gunpla.kits[kit.k].diff, now = performance.now();
    if (st.type === 'timing') {
      const c = st.timing, n = c.n(kd);
      this.session = { type: 'timing', stage: st, n, w: c.w(kd, g), sp: c.sp(kd), i: 0, sc: 0, t0: now, c: this.gate(0, n), msg: '' };
      this.fsm.go('TIMING'); g.bus.emit('minigame:start');
    } else if (st.type === 'assembly') {
      const steps = DATA.gunpla.partOrder.slice(0, 9);
      this.session = { type: 'asm', stage: st, steps, pos: 0, err: 0, last: '', tray: shuffle([...steps, ...DATA.gunpla.decoys]) };
      this.fsm.go('ASSEMBLY'); g.bus.emit('minigame:start');
    } else if (st.type === 'paint') {
      this.fsm.go('PAINT');
      const options = DATA.gunpla.paintOptions.filter(o => (!o.req || g.has(o.req)) && s.m >= g.economy.dc(o.cost)).map(o => ({
        label: o.label,
        run: () => {
          this.fsm.go('IDLE');
          g.economy.spend(g.economy.dc(o.cost)); kit.sty = o.style;
          if (o.wear) g.maint.wearMany(o.wear);
          this.addPoints(Math.round(o.pts * (.7 + .3 * Math.min(1, s.K.gun / 50)) * rnd(.92, 1.08)));
        }
      }));
      g.ui.showModal({ text: 'How do you want to finish the paint job?', options });
    } else {
      this.addPoints(Math.round(st.max * Math.min(1, (.6 + .4 * Math.min(1, s.K.gun / 50)) * (g.has('topc') ? 1 : .55))));

  gate(i, n) { return Math.round((i + 1) * 40 / (n + 1)) / 39; }

  strike(now = performance.now()) {
    const m = this.session;
    if (!m || !this.fsm.is('TIMING')) return null;
    const d = Math.abs(this.cursor(now) - m.c), s = d <= m.w / 2 ? 1 : Math.max(0, 1 - (d - m.w / 2) / .12);
    m.sc += s; m.i++;
    const r = s >= 1 ? 'Perfect!' : s > .5 ? 'Clean enough.' : 'Gouged, stress mark!';
    if (m.i >= m.n) { const q = m.sc / m.n; this.endSession(); this.award(q); return { done: true }; }
    m.c = this.gate(m.i, m.n); m.msg = `${r} Part ${m.i + 1} of ${m.n}`;
    return { done: false, msg: m.msg };
  }
  /* ---- assembly mini-game ---- */
  tap(part) {
    const m = this.session;
    if (!m || !this.fsm.is('ASSEMBLY') || m.pos >= m.steps.length) return { ok: false };
    if (part === m.steps[m.pos]) {
      m.last = part; m.pos++;
      m.tray = shuffle([...m.steps.slice(m.pos), ...DATA.gunpla.decoys]);
      if (m.pos >= m.steps.length) setTimeout(() => this.g.dispatch({ type: 'asm-finish' }), 600);
      return { ok: true };
    }
    m.err++; return { ok: false };
  }
  finishAssembly() {
    const m = this.session;
    if (!m || !this.fsm.is('ASSEMBLY')) return;
    /* No timer: the 0.2 bonus now rewards accuracy (fewer wrong picks) instead of speed */
    const acc = 1 - Math.min(1, m.err / m.steps.length);
    const r = Math.min(1, Math.max(0, m.pos / m.steps.length - m.err * .06) + (m.pos >= m.steps.length ? .2 * acc : 0));
    this.endSession(); this.award(r);
  }
  endSession() { this.session = null; this.fsm.go('IDLE'); this.g.bus.emit('minigame:end'); }
  /* ---- scoring ---- */
  award(q) {
    const s = this.s, g = this.g, st = this.currentStage();
    let f = (.2 + .6 * q + .2 * Math.min(1, s.K.gun / 60)) * (.85 + .15 * Math.min(1, g.stats.efficiency()));
    if (st.id === 'cut') { if (!g.has('nippers')) f *= .8; if (g.has('sand')) f *= 1.1; }
    if (st.id === 'line' && !g.has('liner')) f *= .85;
    this.addPoints(Math.round(st.max * Math.min(1.05, f)));
  }
  addPoints(p) {
    const s = this.s, kit = s.kit, st = this.currentStage(), kd = DATA.gunpla.kits[kit.k].diff;
    kit.q += p; s.K.gun += .7 + .3 * kd; s.N.f += 8;
    if (st.wear) this.g.maint.wearMany(st.wear);
    this.g.log(`🤖 ${st.name} done: +${p} quality.`);
    kit.st++;
    if (kit.st >= DATA.gunpla.stages.length) this.finishKit();
  }
  finishKit() {
    const s = this.s, kit = s.kit, K = DATA.gunpla.kits[kit.k], q = clamp(Math.round(kit.q + rnd(-2, 3))), n = 9;
    s.shelf.push({ k: kit.k, n: K.name, q, st: kit.sty, np: n });
    s.kit = null; s.built++; s.N.f += 20;
    this.g.log(`🎉 Finished ${K.name}! Quality ${q} (${kit.sty}).`);
    this.g.ui.showModal({ text: `🎉 ${K.name} is finished!`, view: { kind: 'model', kit: kit.k, np: n, style: kit.sty, caption: `Quality ${q}, ${kit.sty}` }, options: [{ label: 'Put it on the shelf' }] });
  }
  /* ---- meets ---- */
  joinMeet(l) {
    const s = this.s, g = this.g, m = DATA.gunpla.meets[l];
    s.mj[l + ':' + g.time.dayIndex] = 1;
    const options = s.shelf.map((k, i) => ({ label: `${k.n} (quality ${k.q}, ${k.st})`, run: () => this.judge(l, i) }));
    options.push({ label: 'Just browse', run: () => { s.N.f += 15; s.K.gun += .5; if (s.ppl.length < DATA.maxPeople) this.g.social.meet('gunpla'); g.log('👀 You browsed the displays and got inspired.'); } });
    g.ui.showModal({ text: `${m.n}: ${s.shelf.length ? 'Choose a model to enter, or just browse the displays.' : 'You have no finished kit to enter, but you can browse the displays.'}`, options });
  }
  judge(l, i) {
    const s = this.s, g = this.g, m = DATA.gunpla.meets[l], k = s.shelf[i];
    if (!k) return;
    const sc = k.q * .75 + s.K.gun * .4 + (k.st === 'Straight build' ? 0 : 3) + rnd(-8, 8);
    const rv = [1, 2, 3, 4].map(() => rnd(38, 66) + m.r), pl = 1 + rv.filter(v => v > sc).length, pz = m.pz[pl - 1] || 0;
    k.pl = Math.min(k.pl || 9, pl);
    s.rep += [10, 6, 3, 1, 0][pl - 1]; s.K.gun += 1; s.N.f += 15; s.N.s += 10; s.m += pz;
    if (pl === 1) s.wins++;
    if (s.ppl.length < DATA.maxPeople && Math.random() < .5) g.social.meet('gunpla');
    g.log(`🏆 ${m.n}: your ${k.n} placed #${pl} of 5${pz ? ', won ' + fmt(pz) : ''}.`);
    const rows = [['YOU (' + k.n + ')', sc], ...rv.map((v, j) => ['Rival ' + 'ABCD'[j], v])].sort((a, b) => b[1] - a[1])
      .map((r, j) => `${j + 1}. ${r[0].padEnd(24)} ${Math.round(r[1])}`).join('\n');
    g.ui.showModal({ text: m.n, view: { kind: 'results', kit: k.k, np: k.np || 6, style: k.st, rows, footer: pz ? 'Prize: ' + fmt(pz) : 'No prize this time.' }, options: [{ label: pl === 1 ? '🏆 Champion!' : 'Thanks, judges' }] });
  }
}

/* Everyday activities as short mini-games. A game starts from an action (def.mg) or a work shift. Base effects are applied up front
   (40% of skill gains), and the result adds the rest (up to 120% at a perfect score), so a skipped game (0.5) equals the old flat result
   and reloading mid-game never loses the base reward. */
class MiniGameSystem extends Manager {
  constructor(g) {
    super(g);
    this.fsm = new StateMachine('mini', 'IDLE', { IDLE: ['ON'], ON: ['IDLE'] });
    this.ses = null;
  }
  get idle() { return this.fsm.is('IDLE'); }
  abort() { this.ses = null; this.fsm.force('IDLE'); }
  skillOf(M) { const k = Object.keys(M.gain || {})[0]; return k ? this.s.K[k] : this.s.K.cha; }
  start(id, def, ctx) {
    const g = this.g, s = this.s, shift = id === 'shift', gid = shift ? DATA.jobGames[s.job] : id, M = DATA.mini[gid];
    if (!M || !this.idle || !g.ui.fsm.is('PLAY')) return;
    ctx = ctx || (def && def.ctx) || {};
    const ses = { id: gid, M, shift, ctx, pay: ctx.pay || 0, round: 0, sc: 0, hist: [], msg: '', title: shift ? 'Work shift: ' + DATA.jobs[s.job].n : M.title, sk: this.skillOf(M) };
    ses.tier = clamp(Math.floor(ses.sk / 25), 0, 3);
    this.ses = ses;
    if (M.type === 'meter') this.zone(ses);
    else if (M.type === 'simon') this.phrase(ses);
    else if (M.type === 'quiz') { ses.qs = Array.from({ length: M.n }, () => this.makeQ(M.kind, ses.tier)); ses.i = 0; ses.ok = 0; }
    else { ses.menu = M.menus[s.job] || M.menus.fast; ses.i = 0; this.nextOrder(ses); }
    if (!shift) {
      for (const k in M.gain) s.K[k] += M.gain[k] * .4;
      if (ctx.study) g.academics.study(ctx.study * .4, .4);
    }
    this.fsm.go('ON'); g.bus.emit('minigame:start');
  }
  /* ---- meter ---- */
  zone(ses) {
    const M = ses.M;
    ses.w = clamp(M.w + ses.sk / 500, .08, .4); ses.sp = M.sp + ses.round * .07;
    ses.c = M.move ? rnd(ses.w / 2 + .05, .95 - ses.w / 2) : .5; ses.t0 = performance.now();
  }
  cursor(now) { const m = this.ses; return Math.abs(((now - m.t0) * m.sp / 1000) % 2 - 1); }
  /* ---- simon ---- */
  phrase(ses) {
    const n = ses.M.len + ses.round + Math.min(2, Math.floor(ses.sk / 30));
    ses.seq = Array.from({ length: n }, () => Math.floor(Math.random() * 4));
    ses.phase = 'show'; ses.t0 = performance.now(); ses.pos = 0; ses.mis = 0; ses.cur = -1;
  }
  tone(ses, i) { const f = this.g.fx; if (f && ses.M.tones) f.tone(ses.M.tones[i], .3, 'triangle', .14); }
  update(now) {
    const ses = this.ses;
    if (!ses || ses.M.type !== 'simon' || ses.phase !== 'show') return;
    const el = now - ses.t0 - 300, idx = el < 0 ? -1 : Math.floor(el / 650), cur = idx >= 0 && idx < ses.seq.length && el % 650 < 480 ? ses.seq[idx] : -1;
    if (cur !== ses.cur) { ses.cur = cur; if (cur >= 0) this.tone(ses, cur); }
    if (idx >= ses.seq.length) { ses.phase = 'input'; ses.cur = -1; ses.pos = 0; }
  }
  /* ---- order ---- */
  nextOrder(ses) {
    const n = ses.menu.length, units = 2 + Math.floor(Math.random() * (1 + Math.min(2, ses.tier))), w = ses.menu.map(() => 0);
    for (let u = 0; u < units; u++) w[Math.floor(Math.random() * n)]++;
    ses.want = w; ses.cur = ses.menu.map(() => 0);
  }
  /* ---- questions ---- */
  mc(ans, near, f = String) {
    const set = [...new Set(near.filter(x => x !== ans && x >= 0))];
    for (let d = 1; set.length < 3; d++) if (!set.includes(ans + d)) set.push(ans + d);
    const o = shuffle([ans, ...shuffle(set).slice(0, 3)]);
    return { opts: o.map(f), a: o.indexOf(ans) };
  }
  txt(q, right, wrong) { const o = shuffle([right, ...wrong]); return { q, opts: o, a: o.indexOf(right) }; }
  makeQ(kind, tier) {
    const R = (a, b) => Math.floor(rnd(a, b + 1));
    if (kind === 'subject') kind = pick(DATA.courseKinds[this.s.co] || ['math', 'logic']);
    let q, ans, near, f, code;
    if (kind === 'logic' || kind === 'color' || kind === 'call') { const e = pick(DATA.qbank[kind]); return this.txt(e[0], e[1], e.slice(2)); }
    switch (kind) {
      case 'seq': {
        const t = R(0, tier ? 2 : 1), a = R(1, 9), d = R(2, 6); let sq;
        if (t === 0) { sq = [0, 1, 2, 3].map(i => a + d * i); ans = a + 4 * d; }
        else if (t === 1) { const r = R(2, 3); sq = [0, 1, 2, 3].map(i => a * r ** i); ans = a * r ** 4; }
        else { sq = [1, 2, 3, 4].map(i => i * i + a); ans = 25 + a; }
        q = 'Which number comes next? ' + sq.join(', ') + ', ?'; near = [ans + 1, ans - 1, ans + d, ans - d, ans + 2]; break;
      }
      case 'code': {
        const t = R(0, 2 + (tier ? 2 : 0));
        if (t === 0) { const a = R(1, 9), b = R(2, 5), c = R(2, 6); code = `x = ${a}\nfor i in 1..${b}:\n  x = x + ${c}\nprint(x)`; ans = a + b * c; }
        else if (t === 1) { const a = R(2, 20), b = R(2, 20); code = `a = ${a}\nb = ${b}\nif a > b:\n  print(a - b)\nelse:\n  print(b - a)`; ans = Math.abs(a - b); }
        else if (t === 2) { const l = [R(1, 9), R(1, 9), R(1, 9)]; code = `nums = [${l}]\nprint(nums[1] + nums[2])`; ans = l[1] + l[2]; }
        else if (t === 3) { const w = pick(['jeepney', 'barkada', 'laptop', 'sinigang', 'typhoon']), k = R(2, 4); code = `s = "${w}"\nprint(len(s) * ${k})`; ans = w.length * k; }
        else { const l = Array.from({ length: 5 }, () => R(1, 12)); code = `total = 0\nfor n in [${l}]:\n  if n % 2 == 0:\n    total += n\nprint(total)`; ans = l.filter(n => n % 2 === 0).reduce((x, y) => x + y, 0); }
        q = 'What does this program print?'; near = [ans + 1, ans - 1, ans + 2, ans - 2, ans + 5, ans * 2]; break;
      }
      case 'change': {
        const tot = R(8, 76 + tier * 30) * 5, pay = [100, 200, 500, 1000].find(x => x >= tot) || 2000;
        q = `Total ${fmt(tot)}. The customer pays ${fmt(pay)}. How much change?`; ans = pay - tot; near = [ans + 5, ans - 5, ans + 10, ans - 10, ans + 20, ans - 20]; f = fmt; break;
      }
      case 'route': {
        const t = shuffle([...Array(14).keys()].map(x => x + 5)).slice(0, 3), legs = t.map(v => { const a = R(1, v - 1); return [a, v - a]; });
        const L = 'ABC';
        return { q: 'Which delivery route is the shortest?', code: legs.map((l, i) => `Route ${L[i]}: ${l[0]} km + ${l[1]} km`).join('\n'), opts: ['Route A', 'Route B', 'Route C'], a: t.indexOf(Math.min(...t)) };
      }
      case 'price': {
        const n = R(3, 8 + tier * 3), buy = R(4, 20) * 5, sell = buy + R(2, 8) * 5, pr = sell - buy;
        q = `You buy ${n} items at ${fmt(buy)} each and resell them at ${fmt(sell)} each. Total profit?`; ans = n * pr; near = [ans + pr, ans - pr, n * sell, ans + 50, Math.abs(ans - 50)]; f = fmt; break;
      }
      default: { /* math */
        const m = R(0, tier ? 2 : 1), a = R(4 + tier * 4, 16 + tier * 10), b = R(2, 8 + tier * 3);
        if (m === 0) { q = `${a} + ${b} = ?`; ans = a + b; }
        else if (m === 1) { const x = R(20, 60 + tier * 30), y = R(5, x - 3); q = `${x} − ${y} = ?`; ans = x - y; }
        else { const c = R(3, 9 + tier), d = R(3, 9 + tier); q = `${c} × ${d} = ?`; ans = c * d; }
        near = [ans + 1, ans - 1, ans + 10, ans - 10, ans + 2, ans - 2];
      }
    }
    return { q, code, ...this.mc(ans, near, f) };
  }
  /* ---- input ---- */
  input(c) {
    const ses = this.ses;
    if (!ses || !this.fsm.is('ON')) return null;
    if (c.v === 'skip') { this.finish(.5); return { done: true }; }
    return this['in_' + ses.M.type](ses, c.v);
  }
  in_meter(ses) {
    const M = ses.M, f = this.g.fx, d = Math.abs(this.cursor(performance.now()) - ses.c), sc = d <= ses.w / 2 ? 1 : Math.max(0, 1 - (d - ses.w / 2) / .15);
    ses.hist.push(sc); ses.sc += sc;
    const msg = sc >= 1 ? (d <= ses.w / 6 ? '✨ Perfect! ' : '') + M.good : sc > .5 ? M.ok : M.bad;
    if (f) { if (sc >= 1) f.perfect(); else if (sc < .5) f.miss(); else f.pop(); }
    ses.round++;
    if (ses.round >= M.n) { this.finish(ses.sc / M.n); return { done: true }; }
    this.zone(ses); ses.msg = msg; return { done: false, msg };
  }
  in_simon(ses, v) {
    const M = ses.M, f = this.g.fx;
    if (ses.phase !== 'input') return { done: false, msg: 'Wait for the phrase to finish…' };
    const sym = +v; this.tone(ses, sym);
    if (sym === ses.seq[ses.pos]) {
      ses.pos++;
      if (ses.pos < ses.seq.length) return { done: false, msg: '' };
      ses.sc += Math.max(0, 1 - ses.mis * .34); ses.round++;
      if (f) f.perfect();
      if (ses.round >= M.rounds) { this.finish(ses.sc / M.rounds); return { done: true }; }
      this.phrase(ses); ses.msg = '🎶 Nice! Next phrase…'; return { done: false, msg: ses.msg };
    }
    ses.mis++; if (f) f.miss();
    if (ses.mis >= 3) {
      ses.round++;
      if (ses.round >= M.rounds) { this.finish(ses.sc / M.rounds); return { done: true }; }
      this.phrase(ses); ses.msg = '😵 Lost the rhythm. New phrase…'; return { done: false, msg: ses.msg };
    }
    return { done: false, msg: '❌ Wrong one. Try that note again.' };
  }
  in_quiz(ses, v) {
    const q = ses.qs[ses.i], ok = +v === q.a, f = this.g.fx;
    if (ok) { ses.ok++; if (f) f.perfect(); } else if (f) f.miss();
    const msg = ok ? '✅ Correct!' : '❌ It was: ' + q.opts[q.a];
    ses.i++;
    if (ses.i >= ses.M.n) { this.finish(ses.ok / ses.M.n); return { done: true }; }
    ses.msg = msg; return { done: false, msg };
  }
  in_order(ses, v) {
    if (v === 'clear') { ses.cur = ses.menu.map(() => 0); return { done: false, msg: '' }; }
    if (v !== 'serve') { const i = +v; if (ses.cur[i] < 6) ses.cur[i]++; return { done: false, msg: '' }; }
    const diff = ses.want.reduce((a, w, i) => a + Math.abs(w - ses.cur[i]), 0), sc = diff === 0 ? 1 : diff === 1 ? .5 : 0, f = this.g.fx;
    ses.sc += sc; ses.i++;
    if (f) { if (sc >= 1) f.perfect(); else f.miss(); }
    if (ses.i >= ses.M.n) { this.finish(ses.sc / ses.M.n); return { done: true }; }
    this.nextOrder(ses); ses.msg = sc >= 1 ? '✅ Order correct!' : sc > 0 ? '😅 Off by one item.' : '❌ Wrong order.';
    return { done: false, msg: ses.msg };
  }
  /* ---- result ---- */
  finish(q) {
    const ses = this.ses, g = this.g, s = this.s, M = ses.M;
    q = clamp(q, 0, 1); this.ses = null; this.fsm.go('IDLE');
    const tag = q >= .85 ? 'Excellent' : q >= .6 ? 'Good' : q >= .35 ? 'Okay' : 'Rough', pct = Math.round(q * 100);
    if (ses.shift) {
      const extra = Math.round(ses.pay * (.4 * q - .2));
      s.m = Math.max(0, s.m + extra); s.xp += Math.round(4 * q); if (q >= .8) s.rj = Math.min(100, s.rj + 2);
      g.log(`${M.icon} ${tag} work (${pct}%): ${extra >= 0 ? '+' + fmt(extra) + ' in tips and bonus' : '-' + fmt(-extra) + ' for mistakes'}.`);
    } else {
      for (const k in M.gain) s.K[k] += M.gain[k] * 1.2 * q;
      if (ses.ctx.study) g.academics.study(ses.ctx.study * 1.2 * q, 1.2 * q);
      s.N.f += Math.round((q - .5) * (M.fun ?? 10));
      if (M.food) s.N.h += Math.round((q - .5) * M.food);
      g.log(`${M.icon} ${M.title}: ${tag} (${pct}%).`);
    }
    if (g.fx) { if (q >= .85) g.fx.fanfare(); else if (q < .35) g.fx.miss(); else g.fx.ding(); }
    g.bus.emit('minigame:end');
  }
}

/* Travel: every trip is a choice of ride. Local hops stay inside your current city; trips between cities use jeepneys, tricycles,
   motorcycle taxis, your bike, the rail lines (with transfers) or the EDSA Carousel. Rides cost money and minutes, change your needs,
   and carry their own risks. Service hours and weather decide what is running. */
class TravelManager extends Manager {
  at() { return this.g.world.at(); }
  km(a, b) {
    const A = DATA.geo[a], B = DATA.geo[b], R = Math.PI / 180, dl = (B[0] - A[0]) * R, dn = (B[1] - A[1]) * R;
    const h = Math.sin(dl / 2) ** 2 + Math.cos(A[0] * R) * Math.cos(B[0] * R) * Math.sin(dn / 2) ** 2;
    return Math.max(1, Math.round(2 * 6371 * Math.asin(Math.sqrt(h)) * DATA.transit.road * 10) / 10);
  }
  rush() { const t = this.g.time, h = t.hour; return t.weekday < 5 && ((h >= 6 && h < 9) || (h >= 17 && h < 20)); }
  fm(m) { return m >= 60 ? `${Math.floor(m / 60)}h${m % 60 ? ' ' + String(m % 60).padStart(2, '0') + 'm' : ''}` : `${m} min`; }
  /* Fastest path over the given lines between any station in `from` and any station in `to` (Dijkstra in minutes, with transfers) */
  route(ids, from, to) {
    const T = DATA.transit, N = {}, L = id => T.lines[id];
    ids.forEach(id => L(id).stops.forEach(([n, c, km]) => { N[id + ':' + n] = { id, n, c, km, e: [], d: Infinity, p: null, done: false }; }));
    ids.forEach(id => {
      const st = L(id).stops;
      for (let i = 0; i < st.length - 1; i++) {
        const a = N[id + ':' + st[i][0]], b = N[id + ':' + st[i + 1][0]], m = (b.km - a.km) / L(id).speed * 60;
        a.e.push([b, m, 0]); b.e.push([a, m, 0]);
      }
    });
    T.xfer.forEach(([x, y]) => {
      if (N[x] && N[y]) { N[x].e.push([N[y], T.walk + L(N[y].id).wait, 1]); N[y].e.push([N[x], T.walk + L(N[x].id).wait, 1]); }
    });
    const q = [];
    Object.values(N).forEach(n => { if (n.c === from) { n.d = T.walk + L(n.id).wait; q.push(n); } });
    while (q.length) {
      q.sort((a, b) => a.d - b.d);
      const u = q.shift(); if (u.done) continue; u.done = true;
      u.e.forEach(([v, w, x]) => { if (u.d + w < v.d) { v.d = u.d + w; v.p = [u, x]; q.push(v); } });
    }
    let best = null;
    Object.values(N).forEach(n => { if (n.c === to && n.d < Infinity && (!best || n.d < best.d)) best = n; });
    if (!best) return null;
    const legs = []; let n = best;
    while (n.p) {
      const [u, x] = n.p;
      if (!x) {
        const lg = legs[0];
        if (lg && lg.id === n.id && lg.open) { lg.from = u.n; lg.km += Math.abs(n.km - u.km); }
        else legs.unshift({ id: n.id, from: u.n, to: n.n, km: Math.abs(n.km - u.km), open: true });
      } else if (legs[0]) legs[0].open = false;
      n = u;
    }
    const fare = legs.reduce((a, l) => a + Math.round(L(l.id).fare[0] + L(l.id).fare[1] * l.km), 0);
    return { mins: Math.round(best.d + T.walk), legs, fare };
  }
  /* Every way to get from city `from` to city `to` right now (same city = a local hop) */
  quotes(from, to) {
    const g = this.g, s = this.s, T = DATA.transit, rain = s.wx === 'rain', ty = s.wx === 'ty', h = g.time.hour, rush = this.rush();
    const away = from !== s.city, local = from === to, cha = s.K.cha, km = local ? T.localKm : this.km(from, to), out = [];
    const add = (id, o) => out.push({ id, ...T.modes[id], km, pk: 0, ...o });
    const hrs = m => m / 60;
    if (local) {
      const m = Math.round(km / 4.5 * 60 * (rain ? 1.1 : 1));
      add('walk', { mins: m, fare: 0, eff: { e: -4, y: rain ? -10 : -4, f: 1 }, why: ty ? 'Too dangerous in a typhoon' : 0, sick: rain ? .1 : 0 });
    }
    if (g.has('bike') && km <= 12) {
      const m = Math.round(km / 13 * 60 * (rain ? 1.1 : 1));
      add('bike', { mins: m, fare: 0, eff: { e: -(1.5 + km * 1.6), y: rain ? -10 : -3, f: 2 }, fit: .1 * km, why: ty ? 'Too dangerous in a typhoon' : 0, sick: rain ? .12 : 0 });
    }
    {
      let m = Math.round((local ? 8 : 10) + km / 14 * 60 * (rain ? 1.3 : 1)), f = local ? 13 : Math.round(13 + 1.9 * Math.max(0, km - 4));
      if (ty) { m = Math.round(m * 1.6); f *= 2; }
      add('jeep', { mins: m, fare: f, eff: { y: -(2 + hrs(m) * 2) - (rain ? 3 : 0), e: -1.5 * hrs(m) - 1, f: -hrs(m) }, pk: local ? .02 : .03, why: h < 4 || h >= 22 ? 'Jeepneys rarely run at night' : 0 });
    }
    if (km <= T.trikeMax) {
      const m = Math.round(5 + km / 18 * 60), f = Math.round((35 + 7 * km) * (rain ? 1.2 : 1) * (away && cha < 30 ? 1.3 : 1) * (1 - clamp(cha, 0, 60) / 300));
      add('trike', { mins: m, fare: f, eff: { f: 1 }, why: ty ? 'Not running in a typhoon' : h < 5 || h >= 23 ? 'Tricycles are off the road' : 0 });
    }
    if (km <= 40) {
      const m = Math.round(3 + km / 32 * 60), f = Math.round((50 + 12 * km) * (rain ? 1.4 : 1) * (h >= 21 || h < 5 ? 1.3 : 1));
      add('mc', { mins: m, fare: f, eff: { y: -4, f: 4, e: -1 }, crash: rain ? .05 : .02, why: ty ? 'Riders will not go out in a typhoon' : 0 });
    }
    if (!local) {
      const r = this.route(['lrt1', 'lrt2', 'mrt3'], from, to);
      if (r) add('rail', { mins: r.mins + (rain ? 6 : 0), fare: r.fare, legs: r.legs, eff: rush ? { e: -6, y: -6, f: -3 } : { e: -1, y: -1 }, pk: rush ? .06 : .03,
        delay: r.legs.reduce((a, l) => a + DATA.transit.lines[l.id].fail, 0), delayMin: 60, delayMsg: 'A train broke down and you waited for the next one. +1 hour.',
        why: ty ? 'Rail is suspended in the typhoon' : h < 5 || h >= 22 ? 'Trains run 5 AM to 10 PM' : 0 });
      const b = this.route(['edsa'], from, to);
      if (b) add('edsa', { mins: Math.round((b.mins + (rush ? 7 : h < 5 ? 22 : 0)) * (rain ? 1.12 : 1)), fare: b.fare, legs: b.legs, eff: rush ? { e: -8, y: -6, f: -3 } : { e: 1, y: -1 },
        delay: .08, delayMin: 30, delayMsg: 'EDSA traffic crawled. +30 minutes.', pk: rush ? .04 : .01, why: ty ? 'The Carousel is suspended in the typhoon' : 0 });
    }

  label(q, tag) {
    const L = DATA.transit.lines, route = q.legs ? '<br><small>' + q.legs.map(l => `${L[l.id].icon} ${L[l.id].name}: ${l.from} → ${l.to}`).join(' ➜ ') + '</small>' : '';
    return `<b>${q.icon} ${q.name}</b>${tag ? ' ' + tag : ''} · ${q.fare ? fmt(q.fare) : 'free'} · ${this.fm(q.mins)}${q.why ? ' 🔒 ' + q.why : ''}${route}<br><small>👍 ${q.up}<br>👎 ${q.down}</small>`;
  }
  rides(from, to, loc, back) {
    const g = this.g, qs = this.quotes(from, to), ok = qs.filter(q => !q.why);
    const fast = ok.length ? ok.reduce((a, q) => q.mins < a.mins ? q : a) : null, cheap = ok.length ? ok.reduce((a, q) => q.fare < a.fare ? q : a) : null;
    const sorted = [...ok.sort((a, b) => a.mins - b.mins), ...qs.filter(q => q.why)];
    const options = sorted.map(q => ({ label: this.label(q, [q === fast ? '⚡' : '', q === cheap ? '💰' : ''].join('')), run: () => this.ride(q, to, loc) }));
    options.push({ label: 'Back', run: back });
    const rn = this.rush() ? ' <small>(rush hour)</small>' : '', wx = DATA.weather.label[this.s.wx || 'sun'];
    return { text: `${from === to ? 'Pick a ride' : `Heading to <b>${to}</b> (~${this.km(from, to)} km)`}. ${wx}${rn}<br><small>⚡ fastest · 💰 cheapest. Prices here are quoted for right now.</small>`, options };
  }
  openLocal(k) {
    const g = this.g, at = this.at(), loc = g.world.locations()[k];
    const spec = this.rides(at, at, k, () => {});
    spec.text = `Going to <b>${loc[0]} ${loc[1]}</b>. ` + spec.text.replace(/^Pick a ride\. /, '');
    g.ui.showModal(spec);
  }
  openCities() {
    const g = this.g, s = this.s, at = this.at(), vis = s.vis || [], L = DATA.transit.lines;
    const has = c => Object.entries(L).filter(([, l]) => l.stops.some(x => x[1] === c)).map(([k]) => L[k].icon).join('');
    const list = Object.keys(DATA.cities).filter(c => c !== at).sort((a, b) => this.km(at, a) - this.km(at, b));
    const options = list.map(c => ({ label: `${c === s.city ? '🏠' : '🏙️'} <b>${c}</b> · ${this.km(at, c)} km ${has(c)}${vis.includes(c) ? '' : ' ✨ new'}`, run: () => this.openRides(c) }));
    options.push({ label: 'Never mind' });
    g.ui.showModal({ text: `Where to? You are in <b>${at}</b>.<br><small>Home, school and work only exist in ${s.city}. Time away means missed classes and shifts. ✨ = first visit. Icons show which lines serve the city.</small>`, options });
  }
  openRides(to) {
    const g = this.g, s = this.s, at = this.at();
    g.ui.showModal(this.rides(at, to, to === s.city ? 'home' : 'mall', () => this.openCities()));
  }
  ride(q, to, loc) {
    const g = this.g, s = this.s, R = s.rode = s.rode || {};
    if (q.why) return g.ui.toast(q.why);
    if (s.m < q.fare) return g.ui.toast('Not enough money for the fare!');
    s.m -= q.fare;
    let mins = q.mins; const notes = [];
    g.stats.applyNeedDeltas(q.eff || {});
    if (q.fit) s.K.fit += q.fit;
    if (Math.random() < q.pk) { const n = Math.min(s.m, Math.round(rnd(80, 250))); if (n > 0) { s.m -= n; notes.push(`👜 A pickpocket lifted ${fmt(n)}.`); } }
    if (q.delay && Math.random() < q.delay) { mins += q.delayMin; notes.push('⚠️ ' + q.delayMsg); }
    if (q.crash && Math.random() < q.crash) { s.sick = Math.max(s.sick, 2); s.N.e -= 15; const n = Math.min(s.m, 300); s.m -= n; notes.push(`🏍️ Wipeout! Scraped up and ${fmt(n)} for the clinic. You feel sick.`); mins += 20; }
    if (q.sick && Math.random() < q.sick) { s.sick = Math.max(s.sick, 3); notes.push('🌧️ You got soaked and caught a cold.'); }
    (q.legs ? q.legs.map(l => l.id) : [q.id]).forEach(k => { R[k] = (R[k] || 0) + 1; });
    g.log(`${q.icon} ${q.name} to ${to === this.at() ? DATA.locations[loc].name(s, to === s.city ? g.world.city : DATA.cities[to]) : to}: ${this.fm(mins)}, ${q.fare ? fmt(q.fare) : 'free'}.`);
    notes.forEach(n => g.log(n));
    g.time.advance(mins);
    const was = this.at();
    s.at = to; s.loc = loc;
    if (!(s.vis || (s.vis = [s.city])).includes(to)) { s.vis.push(to); s.N.f += 20; s.K.cha += .4; g.log(`🗺️ First time in ${to}! Explore its mall and park.`); }
    else if (was !== to) g.log(`📍 You arrived in ${to}.`);
  }
}

/* ---------------------------------------------------------------- 5. ACTION REGISTRY */
class ActionRegistry {
  constructor(g) { this.g = g; }
  build() {
    const g = this.g, s = g.state, locs = g.world.locations(), out = [];
    const make = (def, loc) => ({
      key: `${def.id}@${loc}`, loc, sleep: !!def.sleep, mg: !!def.mg || def.id === 'shift',
      name: val(def.name, g), h: val(def.h, g), c: val(def.c, g) || 0, d: val(def.d, g) || {},
      ok: def.ok ? () => def.ok(g) : null,
      run: () => { if (def.fx) g.effects.apply(def.fx); if (def.run) def.run(g, loc); if (def.mg) g.mini.start(def.mg, def); }
    });
    Object.keys(locs).forEach(k => {
      if (k === s.loc || !g.world.avail(k)) return;
      out.push({ key: 'go@' + k, loc: 'go', go: true, name: 'Go to ' + locs[k][1], h: 0, c: 0, d: {}, sleep: false, ok: null, run: () => g.travel.openLocal(k) });
    });
    out.push({ key: 'trip@go', loc: 'go', go: true, name: '🗺️ Travel to another city', h: 0, c: 0, d: {}, sleep: false, ok: null, run: () => g.travel.openCities() });
    DATA.actions.forEach(def => (Array.isArray(def.loc) ? def.loc : [def.loc]).forEach(l => out.push(make(def, l))));
    (DATA.spots[g.world.at()] || []).forEach((p, i) => out.push(make({ id: 'spot' + i, name: p.n, h: p.h, c: p.c, d: p.d, fx: p.sk ? { skill: p.sk } : null }, p.loc)));
    const st = g.hobby.currentStage();
    if (st) {
      out.push({
        key: 'kit-stage@home', loc: 'home', sleep: false, name: `🤖 ${st.name}: ${DATA.gunpla.kits[s.kit.k].name}`, h: st.h, c: 0, d: { e: -4, f: 10 },
        ok: () => g.hobby.idle ? 0 : 'Finish the current step', run: () => g.hobby.startStage()
      });
    }
    const dd = g.time.dayIndex, h = g.time.hour;
    ['mall', 'school', 'court'].forEach(l => {
      const m = DATA.gunpla.meets[l];
      if (g.world.atHome() && g.hobby.meetNow(l, dd, h)) {
        out.push({
          key: 'meet@' + l, loc: l, sleep: false, name: '🤖 Join: ' + m.n, h: 3, c: m.fee, d: { s: 15, f: 20 },
          ok: () => s.mj[l + ':' + dd] ? 'You already joined this meet' : h > m.h[1] - 3 ? 'The meet is closing soon' : 0,
          run: () => g.hobby.joinMeet(l)
        });
      }
    });
    return out;
  }
}

/* ---------------------------------------------------------------- 6. UI CONTROLLER (state machine) */
class UIController {
  constructor(g) {
    this.g = g;
    this.fsm = new StateMachine('ui', 'PLAY', { PLAY: ['MODAL', 'MINIGAME', 'GAMEOVER'], MODAL: ['PLAY', 'GAMEOVER'], MINIGAME: ['PLAY', 'GAMEOVER'], GAMEOVER: ['PLAY'] });
    this.queue = []; this.modal = null; this.tab = 'do';
    g.bus.on('minigame:start', () => this.fsm.go('MINIGAME'));
    g.bus.on('minigame:end', () => this.endMinigame());
  }
  toast(m) { this.g.bus.emit('toast', m); }
  showModal(spec) { this.queue.push(spec); this.pump(); }
  pump() {
    if (this.fsm.is('PLAY') && this.queue.length) { this.modal = this.queue.shift(); this.fsm.go('MODAL'); }
  }
  chooseOption(i) {
    if (!this.fsm.is('MODAL') || !this.modal) return;
    const o = this.modal.options[i];
    if (!o) return;
    this.modal = null; this.fsm.go('PLAY');
    if (o.run) o.run();
    this.pump();
  }
  endMinigame() { if (this.fsm.is('MINIGAME')) { this.fsm.go('PLAY'); this.pump(); } }
  reset() { this.queue = []; this.modal = null; this.tab = 'do'; this.fsm.force('PLAY'); }
}

/* ---------------------------------------------------------------- 7. GAME ENGINE */
class GameEngine {
  constructor() {
    this.state = null;
    this.bus = new EventBus();
    this.storage = new Storage(DATA.saveKey);
    this.ui = new UIController(this);
    this.effects = new EffectEngine(this);
    /* Construction order matters: it is the subscription order on the bus.
       economy before academics so the Sunday bill is paid before semester results. */
    this.world = new WorldManager(this);
    this.time = new TimeManager(this);
    this.stats = new PlayerStats(this);
    this.economy = new EconomyManager(this);
    this.market = new MarketManager(this);
    this.maint = new MaintenanceManager(this);
    this.projects = new ProjectManager(this); this.rooms = new RoomManager(this);
    this.academics = new AcademicsManager(this);
    this.career = new CareerManager(this);
    this.social = new SocialManager(this);
    this.shop = new ShopSystem(this);
    this.hobby = new HobbySystem(this);
    this.mini = new MiniGameSystem(this);
    this.travel = new TravelManager(this);
    this.events = new EventManager(this);
    this.actions = new ActionRegistry(this);
    this.phone = new PhoneManager(this);

  }
  has(k) { return this.maint.working(k); }
  /* ok() helper: 0 when usable, otherwise a reason (distinguishes "not owned" from "needs repair") */
  need(k, msg) { return this.has(k) ? 0 : this.maint.owns(k) ? `Your ${DATA.items[k].name.replace(/^\S+\s/, '')} needs repair (repair shop at the mall)` : msg; }
  push(k, tx, who) {
    const s = this.state; s.ph.unshift({ k, tx, who: who || '', r: 0, d: DATA.days[this.time.weekday].slice(0, 3) + ' ' + clock(this.time.hour) }); s.ph.length = Math.min(s.ph.length, 40);
    if (k === 'msg') this.ui.toast('📩 ' + who);
  }
  feed() {
    const s = this.state; if (!s || s.over || Math.random() > .6) return;
    const src = [['👩 Mom', ['Anak, kumain ka na ba?', 'Ingat ka sa biyahe.', 'Don’t forget the bills this Sunday!']], ...(s.ubar ? [['🧑‍🤝‍🧑 Barkada GC', ['Milk tea later?', 'Who’s up for LAN?']]] : []), ...s.ppl.map(p => [DATA.personTypes[p.t].icon + ' ' + p.n, ['Tara, hang out?', 'Need my notes?']]), ...(s.ucr ? [['💘 Crush', ['Saw your story 👀', 'Good morning!']]] : [])];
    const [who, t] = pick(src);
    if (Math.random() < .5) this.push('msg', pick(t), who);
    else this.push('feed', pick(['posted a story 📸', 'shared a meme 😂', 'is at the mall 🛍️', 'checked in at the park 🌳']), who);
  }
  log(m) { const s = this.state; if (/^(⏰|🏆|💥|🕐|🕵|🚨|⚠|🏅|📂|❌|😠|🤒|🎓)/u.test(m)) this.push('alert', m); s.log.unshift(`${DATA.days[this.time.weekday].slice(0, 3)} ${clock(this.time.hour)} ${m}`); s.log.length = Math.min(s.log.length, 30); }
  boot() {
    const raw = this.storage.load();
    if (raw && raw.N) { this.state = GameState.migrate(raw); if (this.state.over) this.ui.fsm.force('GAMEOVER'); }
    this.bus.emit('render');
  }
  commit() {
    if (!this.state) return;
    this.stats.normalize();
    if (this.state.over && !this.ui.fsm.is('GAMEOVER')) { this.hobby.abort(); this.mini.abort(); this.ui.fsm.go('GAMEOVER'); }
    this.bus.emit('saved', this.storage.save(this.state));
    this.bus.emit('render');
  }
  startGame(f) {
    const tr = f.traits || [];
    if (tr.length !== 2) return this.ui.toast('Pick exactly 2 personas');
    if (tr.some(t => (DATA.traits[t].excl || []).some(x => tr.includes(x)))) return this.ui.toast('Those two personas do not go together');
    const J = DATA.jobs[f.job], K = { ...DATA.start.skills };
    for (const k in DATA.courses[f.course]) K[k] += DATA.courses[f.course][k];
    if (J.req && J.req.skill && K[J.req.skill] < J.req.min) return this.ui.toast('Your course skills are too low for that job');
    this.hobby.abort(); this.mini.abort(); this.ui.reset();
    this.state = GameState.create(f);
    this.log('Your student life begins in ' + this.state.city + '! 🎒');
    this.commit();
  }
  resetGame() {
    this.hobby.abort(); this.mini.abort(); this.ui.reset(); this.state = null; this.storage.clear(); this.bus.emit('render');
  }
  runAction(key) {
    const s = this.state;
    if (!s || s.over || !this.ui.fsm.is('PLAY')) return;
    const a = this.actions.build().find(x => x.key === key);
    if (!a) return;
    const why = a.ok && a.ok();
    if (why) return this.ui.toast(why);
    const cost = this.economy.dc(a.c);
    if (s.m < cost) return this.ui.toast('Not enough money! 😅');
    s.m -= cost;
    const eBefore = s.N.e;
    a.run();
    this.maint.onAction(a.key);
    if (a.sleep) { s.tm = 0; const n = this.time.sleepHours(); for (let i = 0; i < n; i++) this.time.tick(true); }
    else for (let i = 0; i < a.h; i++) this.time.tick();
    this.stats.applyNeedDeltas(a.d);
    if (!a.sleep && s.N.e > 0 && s.N.e < 20 && eBefore >= 20) this.ui.toast('😮‍💨 Energy is low. Go home and sleep before you pass out!');
    if (s.N.e <= 0 && !a.sleep) {
      this.log('😵 You passed out from exhaustion! Lost 6 hours and ₱100.');
      this.economy.spend(100);
      for (let i = 0; i < 6; i++) this.time.tick(true);
    }
    if (!a.sleep && !s.over && this.ui.fsm.is('PLAY') && Math.random() < .12) this.events.random();
    this.commit();
  }
  /* Single entry point for every player command. The Renderer never calls managers directly. */
  dispatch(c) {
    switch (c.type) {
      case 'ph': this.phone.cmd(c); return this.commit();
      case 'tab': if (this.state && this.ui.tab === 'ph') this.state.ph.forEach(x => { x.r = 1; }); this.ui.tab = c.tab; return this.commit();
      case 'start': return this.startGame(c.form);
      case 'reset': return this.resetGame();
      case 'action': return this.runAction(c.key);
      case 'option': this.ui.chooseOption(c.i); return this.commit();
      case 'bank': if (this.ui.fsm.is('PLAY')) { this.economy.bank(c.op); this.commit(); } return;
      case 'hang': if (this.ui.fsm.is('PLAY')) { this.social.hang(c.i); this.commit(); } return;
      case 'strike': { const r = this.hobby.strike(); if (r && r.done) this.commit(); return r; }
      case 'tap': return this.hobby.tap(c.part);
      case 'mg': { const r = this.mini.input(c); if (r && r.done) this.commit(); return r; }
      case 'asm-finish': this.hobby.finishAssembly(); return this.commit();
    }
  }
}

/* ---------------------------------------------------------------- 8. RENDERER (DOM only) */
const hexMix = (h, to, t) => { const a = n => [1, 3, 5].map(i => parseInt(n.slice(i, i + 2), 16)), A = a(h), B = a(to); return '#' + A.map((v, i) => Math.round(v + (B[i] - v) * t).toString(16).padStart(2, '0')).join(''); };
class Renderer {
  constructor(g, root) {
    this.g = g; this.root = root; this.raf = 0; this.toastTimer = 0;
    g.bus.on('render', () => this.render());
    g.bus.on('toast', m => this.toast(m));
    g.bus.on('saved', ok => this.saveFlash(ok));
    root.addEventListener('click', e => this.onClick(e));
    root.addEventListener('change', e => { if (e.target && e.target.id === 'ci') this.fillCity(); else if (e.target && e.target.type === 'file') this.upload(e.target); });
  }
  $(s) { return document.querySelector(s); }
  toast(m) { const e = this.$('#t'); e.textContent = m; e.className = 's'; clearTimeout(this.toastTimer); this.toastTimer = setTimeout(() => { e.className = ''; }, 1800); }
  /* ---- input -> commands ---- */
  onClick(e) {
    const t = e.target.closest('[data-x],[data-tab],[data-a],[data-m],[data-o],[data-p],[data-g],[data-cc],#go,#nw');
    if (!t) return;
    const D = t.dataset, g = this.g;
    if (D.x) g.dispatch({ type: 'ph', x: D.x, f: D.x === 'save' ? this.readMe() : D.x.startsWith('send') ? { t: (this.$('#cm') || {}).value } : D.x === 'ksend' ? { t: (this.$('#kc') || {}).value } : null });
    else if (D.tab) g.dispatch({ type: 'tab', tab: D.tab });
    else if (D.a) g.dispatch({ type: 'action', key: D.a });
    else if (D.m) g.dispatch({ type: 'bank', op: D.m });
    else if (D.o != null) g.dispatch({ type: 'option', i: +D.o });
    else if (D.p != null) g.dispatch({ type: 'hang', i: +D.p });
    else if (D.cc != null) this.ccTap(D.cc);
    else if (D.g === 'h') {
      const r = g.dispatch({ type: 'strike' });
      if (r && !r.done) { const el = this.$('#rr'); if (el) el.textContent = r.msg; }
    } else if (D.g === 't') {
      const r = g.dispatch({ type: 'tap', part: D.v });
      if (r && r.ok) this.refreshAssembly();
      else { t.style.outline = '2px solid var(--bad)'; setTimeout(() => { t.style.outline = ''; }, 300); }
    }
    else if (D.g === 'mg') { const r = g.dispatch({ type: 'mg', v: D.v }); if (r && !r.done) this.refreshMini(r); }
    else if (t.id === 'go') g.dispatch({ type: 'start', form: this.readForm() });
    else if (t.id === 'nw') { if ((g.state && g.state.over) || confirm('Restart the game?')) g.dispatch({ type: 'reset' }); }
  }
  readForm() {
    return {
      name: this.$('#nm').value, course: this.$('#co').value, job: this.$('#jb').value, city: this.$('#ci').value,
      school: this.$('#sc').value, bg: this.$('#bg').value,
      traits: [...document.querySelectorAll('.tr:checked')].map(x => x.value), look: this.cc
    };
  }
  /* ---- helpers ---- */
  bar(v, c) { return `<div class="br"><i style="width:${clamp(v)}%;background:${c || (v > 50 ? 'var(--ok)' : v > 25 ? 'var(--wn)' : 'var(--bad)')}"></i></div>`; }
  esc(t) { return String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
  model(k, ps, sty, fl, sm, o) {
    return `<svg class="mdl3d${sm ? ' sm' : ''}" viewBox="-26 -26 172 180" style="${DATA.gunpla.finishCss[sty] || ''}">${this.mini(k, ps, sty, fl, 'm' + (this.mid = (this.mid || 0) + 1), o)}</svg>`;
  }
  /* Vector gunpla: shaded plastic, panel lines, per-kit silhouette, backpack, weapon and shield, poses and kitbashed parts */
